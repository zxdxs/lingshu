<div class="kicker">04 · 題目頁樣張</div>
<h2 style="margin-top:18px">三種題，三種用途</h2>
<div class="card"><div class="q">《靈樞·陰陽清濁》：「受穀者____，受氣者清」</div><div class="a">答：<b>濁</b><span class="tag">答案類型：原文</span></div></div>
<div class="card"><div class="q">《靈樞·陰陽清濁》的主旨是？</div><div class="a">答：<b>清氣濁氣的生成與升降</b><br/>干擾：耐痛與體質的關係／五藏六府脹的形態與病機／藏府的大小高下堅脆偏傾與體表候</div></div>
<div class="card"><div class="q">《靈樞·厥病》：「厥心痛，腹脹胷滿，心尤痛甚」。依〈厥病〉，此屬五心痛之哪一型？當取何穴？</div><div class="a">答：<b>胃心痛；取大都、大白</b><span class="tag">待專家核</span></div></div>
